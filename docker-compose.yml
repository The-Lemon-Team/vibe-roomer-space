name: vibe-roomer-dev

# ─────────────────────────────────────────────────────────────────────────────
# Local development Postgres (default).
#
# Start with: npm run db:up
# Connection string (see .env.example):
#   postgresql://postgres:postgres@localhost:5448/viberoomer?schema=public
#
# For Supabase-backed runs, use .env.supabase.example instead — this compose
# file is not needed at runtime in that case.
# ─────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:16-alpine
    container_name: vibe-roomer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: viberoomer
    ports:
      - "5448:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d viberoomer"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
