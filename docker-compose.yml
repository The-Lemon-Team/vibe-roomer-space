version: '3.8'

name: vibe-roomer-dev

# ─────────────────────────────────────────────────────────────────────────────
# Development only — local Postgres for offline dev / CI without Supabase.
#
# Production uses Supabase (external hosted Postgres).
# Set DATABASE_URL + DIRECT_URL in .env to your Supabase connection strings
# and this file is not needed at runtime.
# ─────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:16-alpine
    container_name: vibe-roomer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: viberoomer
    ports:
      - "5448:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d viberoomer"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
