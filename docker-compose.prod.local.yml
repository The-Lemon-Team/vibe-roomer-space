services:
  backend:
    container_name: vibe-roomer-backend-prod-local
    command: ["sh", "-c", "npx prisma db push && node dist/main.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    container_name: vibe-roomer-frontend-prod-local
