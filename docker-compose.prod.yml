version: '3.8'

name: vibe-roomer-prod

services:

  # ── NestJS Backend ─────────────────────────────────────────────
  # Database is hosted on Supabase — no local postgres service needed.
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: vibe-roomer-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (Supabase pooler URL)}
      DIRECT_URL: ${DIRECT_URL:?DIRECT_URL is required (Supabase direct URL for migrations)}
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      UPLOADS_DIR: ./uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Nginx + Vite Frontend ───────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: vibe-roomer-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy

volumes:
  uploads_data:
    driver: local

networks:
  internal:
    driver: bridge
